project:
  name: "Road Accident Severity Predictor"
  version: "1.0.0"
  random_state: 42

paths:
  raw_data: "data/raw/road_accidents_demo.csv"
  processed_train: "data/processed/train_processed.parquet"
  processed_test: "data/processed/test_processed.parquet"
  models_dir: "models"
  best_model_path: "models/best_model.joblib"
  preprocessor_path: "models/preprocessor.joblib"
  label_encoder_path: "models/label_encoder.joblib"
  metadata_path: "models/model_metadata.json"
  evaluation_dir: "models/evaluation_reports"
  figures_dir: "reports/figures"

data:
  target_column: "accident_severity"
  # Target classes ordered by severity: Slight, Serious, Fatal
  target_classes: ["Slight", "Serious", "Fatal"]
  test_size: 0.20
  stratify: true

  # Pre-accident features strictly avoiding target leakage
  categorical_features:
    - "weather_conditions"
    - "road_surface_conditions"
    - "light_conditions"
    - "road_type"
    - "urban_or_rural_area"
    - "junction_detail"
    - "day_of_week"
    - "driver_age_band"
    - "vehicle_type"

  numerical_features:
    - "speed_limit"
    - "number_of_vehicles"
    - "hour_of_day"

  time_feature: "accident_time"

models:
  random_forest:
    n_estimators: 200
    max_depth: 12
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 150
    max_depth: 5
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.85
    eval_metric: "mlogloss"
    random_state: 42
    n_jobs: -1

evaluation:
  metrics:
    - "accuracy"
    - "macro_f1"
    - "weighted_f1"
    - "macro_precision"
    - "macro_recall"
    - "roc_auc_ovr"

